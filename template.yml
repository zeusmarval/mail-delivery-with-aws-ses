AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: COMMON SERVICES - MAIL DELIVERY | Stack para envio de correos
  electronicos mediante AWS SES

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: Ambiente de despliegue (dev, qa, prod)

Conditions:
  IsProd: !Equals
    - !Ref Environment
    - prod

Resources:

  MailDeliveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-mail-delivery
      Description: COMMON SERVICES - MAIL DELIVERY | Funcion Lambda para envio de
        correos electronicos mediante AWS SES con soporte para adjuntos
      Runtime: python3.13
      Handler: app.lambda_handler
      CodeUri: src/lambdas/email-delivery
      Timeout: 25
      Architectures:
        - x86_64
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  MailDeliveryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-mail-delivery
      RetentionInDays: !If
        - IsProd
        - 7
        - 1

Outputs:

  MailDeliveryFunctionArn:
    Description: ARN de la funcion Lambda de envio de correos
    Value: !GetAtt MailDeliveryFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-mail-delivery-function-arn